name: 功能建议
description: 想要新功能，或者觉得现有的某个交互能更好用
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        说清楚「想解决什么问题」，比直接给方案更好讨论。
        提交前请先[搜索已有议题](../../issues?q=is%3Aissue)，避免重复。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / 遇到的麻烦
      description: 现在的用法是什么，哪里让你觉得别扭或费时间
      placeholder: 每次装模组都要手动一个个选版本，很容易选错……
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你期望的效果
      description: 大概描述就好，不用画图
    validations:
      required: true

  - type: input
    id: reference
    attributes:
      label: 参考（可选）
      description: 如果其他启动器（PCL / HMCL / 官方启动器等）已经有类似功能，写明是哪一个的什么功能，并说明你希望保留还是调整它的做法
